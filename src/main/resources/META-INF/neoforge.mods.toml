modLoader = "javafml"
# NeoForge's javafml version is independent of the MC version (1.21.1 = FML 4.x); do not copy Forge's [21,)
loaderVersion = "[4,)"
license = "MIT"

[[mods]]
modId = "create_colored_connections"
version = "0.1.0"
displayName = "Create: Colored Connections"
logoFile = "icon.png"
authors = "Rlosking-C"
description = '''
Colorize Factory Gauge recipe links with the 16 vanilla dyes, so heavily
crossed networks stay readable at a glance.
'''

[[dependencies.create_colored_connections]]
    modId = "neoforge"
    type = "required"
    versionRange = "[21.1.0,)"
    ordering = "NONE"
    side = "BOTH"

[[dependencies.create_colored_connections]]
    modId = "minecraft"
    type = "required"
    versionRange = "[1.21.1,1.22)"
    ordering = "NONE"
    side = "BOTH"

[[dependencies.create_colored_connections]]
    modId = "create"
    type = "required"
    versionRange = "[6.0.0,)"
    ordering = "AFTER"
    side = "BOTH"

[[mixins]]
    config = "createcc.mixins.json"
