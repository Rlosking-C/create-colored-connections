pluginManagement {
    repositories {
        // ModDevGradle 插件仓库
        maven { url = 'https://maven.neoforged.net/releases' }
        gradlePluginPortal()
    }
}

plugins {
    // 自动下载匹配的 JDK 工具链
    id 'org.gradle.toolchains.foojay-resolver-convention' version '0.8.0'
}

rootProject.name = 'create-colored-connections'
