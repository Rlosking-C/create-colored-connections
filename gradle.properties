# Base Gradle settings
org.gradle.jvmargs = -Xmx3G
org.gradle.daemon = false
org.gradle.parallel = true

# Proxy settings live in the user-global ~/.gradle/gradle.properties (machine-specific)

# Mod metadata
mod_version = 0.4.1
mod_id = create_colored_connections
mod_name = Create: Colored Connections
mod_license = MIT

# Environment versions (Create: Extra Gauges 2.1.2 requires NeoForge >= 21.1.227; use latest 21.1.248)
minecraft_version = 1.21.1
neo_version = 21.1.248
parchment_version = 2024.11.17

# Dependency versions (6.0.10 line = the current public release on Modrinth/CurseForge;
# the released jar itself reports version "6.0.10" — 6.0.10-281 is the newest build
# of that line on maven.createmod.net)
create_version = 6.0.10-281

# Libraries Create re-exports. Create's published metadata for the 6.0.10 release marks
# every dependency as runtime-only, so addons must declare them for compilation.
# The versions below are exactly what the released create-1.21.1-6.0.10.jar bundles (JarJar),
# so compiling here matches what players actually run.
ponder_version = 1.0.82
registrate_version = MC1.21-1.3.0+67
flywheel_version = 1.0.6
