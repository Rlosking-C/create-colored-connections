# 基础 Gradle 配置
org.gradle.jvmargs = -Xmx3G
org.gradle.daemon = false
org.gradle.parallel = true

# Gradle HTTP/HTTPS 代理（Java 进程不走系统代理，需显式配置）
systemProp.http.proxyHost = 192.168.1.101
systemProp.http.proxyPort = 2080
systemProp.https.proxyHost = 192.168.1.101
systemProp.https.proxyPort = 2080

# 模组信息
mod_version = 0.1.0
mod_id = create_colored_connections
mod_name = Create: Colored Connections
mod_license = MIT

# 环境版本（与 Create 6.0.11 官方完全一致）
minecraft_version = 1.21.1
neo_version = 21.1.219
parchment_version = 2024.11.17

# 依赖版本（maven.createmod.net 上的最新构建）
create_version = 6.0.11-300
