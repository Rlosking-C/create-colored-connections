# Base Gradle settings
org.gradle.jvmargs = -Xmx3G
org.gradle.daemon = false
org.gradle.parallel = true

# Gradle HTTP/HTTPS proxy (the JVM ignores the system proxy; set it explicitly)
systemProp.http.proxyHost = 192.168.1.101
systemProp.http.proxyPort = 2080
systemProp.https.proxyHost = 192.168.1.101
systemProp.https.proxyPort = 2080

# Mod metadata
mod_version = 0.1.0
mod_id = create_colored_connections
mod_name = Create: Colored Connections
mod_license = MIT

# Environment versions (Create: Extra Gauges 2.1.2 requires NeoForge >= 21.1.227; use latest 21.1.248)
minecraft_version = 1.21.1
neo_version = 21.1.248
parchment_version = 2024.11.17

# Dependency versions (latest build on maven.createmod.net)
create_version = 6.0.11-300
