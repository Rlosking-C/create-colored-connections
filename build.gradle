plugins {
    id 'net.neoforged.moddev' version '2.0.144'
}

version = mod_version
group = 'com.colconn'

base { archivesName = 'create-colored-connections' }

java {
    toolchain { languageVersion = JavaLanguageVersion.of(21) }
}

// Third-party repositories required by the addon (mirrors Create's official build.gradle)
repositories {
    // Create itself / Flywheel / Ponder
    maven { url = 'https://maven.createmod.net' }
    // Registrate snapshot repository
    maven { url = 'https://maven.ithundxr.dev/snapshots' }
    // Ponder transitive dependency: NeoForge Config API Port
    maven { url = 'https://raw.githubusercontent.com/Fuzss/modresources/main/maven' }
    // Modrinth Maven: addons used for compatibility testing (Create: Extra Gauges)
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
        content { includeGroup 'maven.modrinth' }
    }
}

neoForge {
    version = project.neo_version

    // Matches Create's official Parchment mappings
    parchment {
        minecraftVersion = project.minecraft_version
        mappingsVersion = project.parchment_version
    }

    mods {
        create_colored_connections { sourceSet(sourceSets.main) }
    }

    runs {
        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
        }
        client { client() }
        // Dedicated server run: verifies the multiplayer side of the mod locally
        // (config ownership, packet handling, no client-only config reads)
        server { server() }
    }
}

dependencies {
    // Create 6.0.10 (fat jar, the current public release). Its published metadata also declares
    // Create's own dev-only integration libraries (JEI, FTB, JourneyMap, Curios, CC:Tweaked,
    // Architectury, Vanillin, ...) as runtime dependencies — none of them ship inside the
    // released jar, none are used by this addon, and several are not hosted in the repositories
    // above, so they are excluded here.
    implementation("com.simibubi.create:create-${minecraft_version}:${create_version}") {
        exclude group: 'mezz.jei'
        exclude group: 'maven.modrinth'
        exclude group: 'dev.ftb.mods'
        exclude group: 'info.journeymap'
        exclude group: 'dev.engine-room.vanillin'
        exclude group: 'top.theillusivec4.curios'
        exclude group: 'cc.tweaked'
        exclude group: 'dev.architectury'
    }
    // Libraries Create re-exports. The 6.0.10 release publishes its own dependencies as
    // runtime-only, so they must be declared here to be visible at compile time
    // (the 6.0.11 dev builds expose them as compile scope instead). Ponder carries
    // Catnip (net.createmod.catnip.*), which the client rendering code uses.
    implementation "net.createmod.ponder:ponder-neoforge:${ponder_version}+mc${minecraft_version}"
    implementation "com.tterrag.registrate:Registrate:${registrate_version}"
    compileOnly "dev.engine-room.flywheel:flywheel-neoforge-api-${minecraft_version}:${flywheel_version}"
    // Runtime-only: compatibility verification against Create: Extra Gauges (not compiled against)
    runtimeOnly "maven.modrinth:extra-gauges:2.1.2"
    // Extra Gauges dependency: Create: Deployer API
    runtimeOnly "maven.modrinth:deployer:0.1.2"
    // Factory Controller is an optional integration, never a prerequisite: it is
    // compiled against only (compileOnly), so the plain client and server runs
    // behave exactly like the game of a player who does not have it installed —
    // the case FCCompatMixinPlugin's gate exists for. To test the integration
    // itself, drop create-factory-controller-1.2.1-neoforge-1.21.1.jar (it is
    // already in the Gradle cache) into run/mods and start the client again; a
    // jar in that folder is always discovered, which is how Configured is loaded
    // here too. Remove it again to go back to the absent case.
    // Version: keep in sync with FCCompatMixinPlugin.FC_MIN_VERSION and
    // FactoryControllerCompat.FC_MIN_VERSION. Requires Create >= 6.0.10 and
    // NeoForge >= 21.1.227 (both satisfied above).
    compileOnly "maven.modrinth:create-factory-controller:1.2.1-neoforge-1.21.1"
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// Expand version placeholders in the mod metadata from gradle.properties,
// so a release only needs bumping mod_version in one place
tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
        minecraft_version: minecraft_version,
        neo_version      : neo_version,
        mod_version      : mod_version,
    ]
    inputs.properties replaceProperties
    filesMatching('META-INF/neoforge.mods.toml') {
        expand replaceProperties
    }
}
