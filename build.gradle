plugins {
    id 'net.neoforged.moddev' version '2.0.144'
}

version = mod_version
group = 'com.colconn'

base { archivesName = 'create-colored-connections' }

java {
    toolchain { languageVersion = JavaLanguageVersion.of(21) }
}

// Third-party repositories required by the addon (mirrors Create's official build.gradle)
repositories {
    // Create itself / Flywheel / Ponder
    maven { url = 'https://maven.createmod.net' }
    // Registrate snapshot repository
    maven { url = 'https://maven.ithundxr.dev/snapshots' }
    // Ponder transitive dependency: NeoForge Config API Port
    maven { url = 'https://raw.githubusercontent.com/Fuzss/modresources/main/maven' }
    // Modrinth Maven: addons used for compatibility testing (Create: Extra Gauges)
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
        content { includeGroup 'maven.modrinth' }
    }
}

neoForge {
    version = project.neo_version

    // Matches Create's official Parchment mappings
    parchment {
        minecraftVersion = project.minecraft_version
        mappingsVersion = project.parchment_version
    }

    mods {
        create_colored_connections { sourceSet(sourceSets.main) }
    }

    runs {
        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
        }
        client { client() }
    }
}

dependencies {
    // Create 6.0.11 (fat jar): its POM transitively resolves Registrate / Ponder / Flywheel
    implementation "com.simibubi.create:create-${minecraft_version}:${create_version}"
    // Runtime-only: compatibility verification against Create: Extra Gauges (not compiled against)
    runtimeOnly "maven.modrinth:extra-gauges:2.1.2"
    // Extra Gauges dependency: Create: Deployer API
    runtimeOnly "maven.modrinth:deployer:0.1.2"
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
